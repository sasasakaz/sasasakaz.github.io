<body class="layout-3col">
  <div class="topbar">
    <button type="button" id="btn-left" class="topbar-btn" aria-controls="site-nav" aria-expanded="false"></button>
    <div id="topbar-title" class="topbar-title"></div>
  </div>
  <div id="side-backdrop" class="side-backdrop"></div>
  <div class="layout">
    <nav id="site-nav" class="side side-left" aria-label="ページ一覧"></nav>

    <main id="content">
      <header id="header">
        <h1>Amazon Clean</h1>
        <p class="muted">Amazonの長いURLからASINを抽出してシンプルな商品ページURLに変換するにゃん。</p>
      </header>

      <div class="container">
        <p><strong>Long URL</strong></p>
        <div class="url-row">
          <input id="url" aria-label="Long URL" />
          <button class="clear-btn" id="clearUrl" title="clear" aria-label="Clear URL">✕</button>
          <button id="shorten" class="btn shorten-btn">Shorten</button>
        </div>

        <div class="row">
          <div>
            <p>domain</p>
            <select id="domain" aria-label="domain">
              <option value="co.jp">amazon.co.jp</option>
              <option value="com">amazon.com</option>
              <option value="co.uk">amazon.co.uk</option>
              <option value="de">amazon.de</option>
              <option value="fr">amazon.fr</option>
              <option value="it">amazon.it</option>
              <option value="ca">amazon.ca</option>
            </select>
          </div>
          <div>
            <p>URL style</p>
            <select id="style" aria-label="URL style">
              <option value="dp">/dp/ASIN</option>
              <option value="gp">/gp/product/ASIN</option>
            </select>
          </div>
        </div>

        <section class="result-section" aria-labelledby="shortUrlLabel">
          <p id="shortUrlLabel"><strong>Short URL</strong></p>
          <div class="result-row">
            <div id="cleanOut" aria-live="polite"> — </div>
            <button id="copyClean" class="btn">Copy</button>
          </div>
        </section>

        <div id="history" class="muted">
          <strong>History</strong>
          <ul id="historyList"></ul>
        </div>
      </div>

      <footer id="footer">
        <div class="footer-links">
          <a href="https://sasasakaz.github.io/">🏠 Home</a>
          <span class="separator">|</span>
          <a href="#header">Back to Top</a>
        </div>
        <p>Author: sasasakaz</p>
      </footer>
    </main>
  </div>

  <script>
    const patterns = [
      /\/dp\/([A-Z0-9]{10})(?:[/?]|$)/i,
      /\/gp\/product\/([A-Z0-9]{10})(?:[/?]|$)/i,
      /\/product\/([A-Z0-9]{10})(?:[/?]|$)/i,
      /\/gp\/aw\/d\/([A-Z0-9]{10})(?:[/?]|$)/i,
      /\/exec\/obidos\/ASIN\/([A-Z0-9]{10})(?:[/?]|$)/i,
      /[?&]asin=([A-Z0-9]{10})(?:[&]|$)/i,
    ];

    const urlEl = document.getElementById('url');
    const domainEl = document.getElementById('domain');
    const styleEl = document.getElementById('style');
    const cleanOut = document.getElementById('cleanOut');
    const copyBtn = document.getElementById('copyClean');
    const historyList = document.getElementById('historyList');

    document.getElementById('clearUrl').addEventListener('click', () => {
      urlEl.value = '';
      urlEl.focus();
    });

    function extractASIN(url) {
      try {
        const u = decodeURIComponent(url);
        for (const p of patterns) {
          const m = u.match(p);
          if (m) return m[1].toUpperCase();
        }
        const fallback = u.match(/([A-Z0-9]{10})(?:[/?]|$)/i);
        if (fallback) return fallback[1].toUpperCase();
      } catch (e) { console.warn('extractASIN error', e); }
      return null;
    }

    function buildCleanUrl(domain, style, asin) {
      if (!asin) return '';
      const host = 'www.amazon.' + domain;
      return style === 'dp' ? `https://${host}/dp/${asin}` : `https://${host}/gp/product/${asin}`;
    }

    function addHistory(url) {
      const li = document.createElement('li');
      li.textContent = url;
      historyList.prepend(li);
    }

    document.getElementById('shorten').addEventListener('click', () => {
      const raw = urlEl.value.trim();
      if (!raw) { alert('Enter the URL.'); return; }
      const asin = extractASIN(raw);
      if (!asin) { cleanOut.textContent = 'The ASIN was not found. Please check the URL.'; return; }
      const url = buildCleanUrl(domainEl.value, styleEl.value, asin);
      cleanOut.textContent = url;
      addHistory(url);
    });

    let copyTimer;
    copyBtn.addEventListener('click', async () => {
      const txt = cleanOut.textContent.trim();
      if (!txt || txt === '—') return;
      await navigator.clipboard.writeText(txt);
      // ボタンの大きさは変えず、ラベルだけ一定時間 Copied! にする
      copyBtn.textContent = 'Copied!';
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
    });
  </script>
