<!DOCTYPE html>
<html lang="ja">
<!-- 
MarkdownをHTMLに変換するツール
Created: 2026-04-25
Updated: 2026-10-25
Description: MarkdownをHTMLに変換する。逆も可能。
Notes: プレビュー用のHTMLとCSSは、右上設定ボタンから自由に編集可能。hilight.js利用時はペースト先のHTMLにhighlight.jsとCSSの追加が必要。
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown to HTML</title>
  <link rel="canonical" href="https://sasasakaz.github.io/pages/markdown_converter.html">
  <link rel="icon" href="https://sasasakaz.github.io/images/sasasakaz.png">
  <meta name="description" content="MarkdownをHTMLに変換するツールにゃん。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Markdown to HTML">
  <meta property="og:description" content="MarkdownをHTMLに変換するツールにゃん。">
  <meta property="og:url" content="https://sasasakaz.github.io/pages/markdown_converter.html">
  <meta property="og:site_name" content="sasasakaz">
  <meta property="og:locale" content="ja_JP">
  <link rel="stylesheet" href="page_common.css">
  <link rel="stylesheet" href="markdown_converter.css">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
  <script src="page_layout.js" defer></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QRGD44CZBH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-QRGD44CZBH');
  </script>
  <!-- End Google tag (gtag.js) -->
</head>

<body class="layout-3col l3-drawer">

  <!-- 上部バー: 左ボタン（ページ一覧を開く）＋ このツールの操作ボタン。
       #topbar-title は置かない（ページ名は下の h1。目次がないので章名の更新も不要） -->
  <header class="topbar" id="topbar">
    <button type="button" id="btn-left" class="topbar-btn" aria-controls="site-nav" aria-expanded="false"></button>
    <h1 id="page-title">MarkdownをHTMLに変換するにゃん</h1>
    <div class="dd">
      <button type="button" class="icon-btn" title="変換方向" aria-label="変換方向">⇄</button>
      <div class="dd-panel">
        <div class="dd-title">変換方向（切り替えると入力欄は空になります）</div>
        <button type="button" class="dd-item current" data-mode="md2html" onclick="requestModeChange('md2html')">MD →
          HTML</button>
        <button type="button" class="dd-item" data-mode="html2md" onclick="requestModeChange('html2md')">HTML →
          MD</button>
      </div>
    </div>
    <span class="mode-badge" id="mode-badge">MD→HTML</span>
    <div class="tools" id="tag-controls">
      <div class="dd">
        <button type="button" class="btn-tag btn-md">挿入 ▾</button>
        <div class="dd-panel" id="insert-panel"></div>
      </div>
      <span class="tools" id="pinned-btns"></span>
    </div>
    <div class="right-tools">
      <button type="button" class="btn-preview" id="preview-btn" onclick="openPreview()">Preview</button>
      <button type="button" class="btn-copy" id="copy-btn" onclick="copyToClipboard()"><span class="btn-label">Copy
          HTML</span><span class="btn-done" aria-hidden="true">✓</span></button>
      <button type="button" class="icon-btn" id="settings-btn" title="Preview設定（CSS / HTML）。もう一度押すと閉じる"
        aria-expanded="false">⚙</button>
    </div>
  </header>
  <div id="side-backdrop" class="side-backdrop"></div>

  <div class="layout">
    <nav id="site-nav" class="side side-left" aria-label="ページ一覧"></nav>

    <main id="content">

      <div class="sync-banner hidden" id="sync-banner">
        <span>⚠️ 別のタブでこの内容が更新されました。今の編集内容は保存すると上書きされます。</span>
        <div class="sync-banner-buttons">
          <button type="button" class="btn-sync-reload" onclick="reloadFromOtherTab()">最新を読み込む</button>
          <button type="button" class="btn-sync-dismiss" onclick="dismissSyncBanner()">このまま続ける</button>
        </div>
      </div>

      <div class="main-container">
        <!-- 左側：入力と予備欄 -->
        <div class="editor-section">
          <textarea id="markdown-input" placeholder="Input Markdown..."></textarea>
          <div class="draft-label">📝 予備欄（迷ってる文案の避難用メモ・自動保存されます）</div>
          <textarea id="draft-input" placeholder="採用するか迷っているmdをここに置いておけます..."></textarea>
        </div>

        <!-- 右側：出力とボタン、設定欄 -->
        <div class="editor-section">
          <div id="html-output" class="output"></div>
        </div>
      </div>

      <footer id="footer">
        <div class="footer-links">
          <a href="https://sasasakaz.github.io/">🏠 Home</a>
          <span class="separator">|</span>
          <a href="#header">Back to Top</a>
        </div>
        <p>Author: sasasakaz</p>
      </footer>
    </main>
  </div>

  <aside class="settings-wrapper settings-panel" id="settings-wrapper" aria-label="Preview設定">
    <div class="panel-head">
      <strong>⚙ Preview設定</strong>
      <button type="button" class="css-preset-btn" onclick="resetSettings()">初期値に戻す</button>
    </div>
    <div class="settings-area">
      <label>Preview画面に適用するCSS</label>
      <div class="css-preset-buttons">
        <button type="button" class="css-preset-btn active" id="preset-inline-btn"
          onclick="applyCssPreset('inline')">🖊️ インライン入力</button>
        <button type="button" class="css-preset-btn" id="preset-external-btn" onclick="applyCssPreset('external')">🔗
          外部ファイル参照</button>
      </div>
      <div class="css-mode-hint hidden" id="css-mode-hint"></div>
      <textarea id="css-input"></textarea>
    </div>

    <div class="settings-area">
      <label>Preview画面に適用するHTML {{content}}部分に変換結果が入る</label>
      <textarea id="wrapper-input"></textarea>
    </div>
  </aside>

  <script>
    const defaultCSS = `body { font-family: sans-serif; line-height: 1.6; padding: 2.5rem; max-width: 768px; margin: auto; background: white; color: #333; }
blockquote { border-left: 0.25rem solid #ccc; margin: 1.5rem 1.25rem; padding: 0.5rem 1.25rem; color: #666; background-color: #f9f9f9; }
mark { background-color: #fff176; }
.inline-note { background-color: #f0f0f0; color: #c7254e; padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 90%; margin: 0 2px; }
.inline-code { background-color: #f0f0f0; color: #c7254e; padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 90%; margin: 0 2px; }
.inline-mark { background-color: #fff176; padding: 0 2px; }
.inline-pink { background-color: #f8bbd0; padding: 0 2px; }
.inline-marker { background: linear-gradient(transparent 60%, #fff176 60%); padding: 0 2px; }
.inline-gray { background-color: #eceff1; padding: 0 2px; }
.mdc-info-box { background-color: #e8f5e9; border-left: 0.25rem solid #4caf50; padding: 1rem; margin: 0.75rem 0; border-radius: 0.5rem; }
.mdc-warn-box { background-color: #fff3e0; border-left: 0.25rem solid #ff9800; padding: 1rem; margin: 0.75rem 0; border-radius: 0.5rem; }
.mdc-alert-box { background-color: #ffebee; border-left: 0.25rem solid #f44336; padding: 1rem; margin: 0.75rem 0; border-radius: 0.5rem; }
.mdc-note-box { background-color: #eceff1; border-left: 0.25rem solid #607d8b; padding: 1rem; margin: 0.75rem 0; border-radius: 0.5rem; }
.post-body table { width: 100%; border-collapse: collapse; margin: 20px 0; line-height: 1.6; border: 1px solid #d0e7f5; }
.post-body th, .post-body td { border: 1px solid #d0e7f5; }
.post-body th { padding: 12px 8px; font-weight: bold; text-align: left; background-color: #e8f4fc; color: #2b5b84; white-space: nowrap; }
.post-body td { padding: 16px 8px; text-align: left; vertical-align: top; }`;

    const defaultWrapper = `<!DOCTYPE html>
<html>
<head>
    <title>HTML Preview</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"><\/script>
    <style>{{css}}</style>
</head>
<body>
  <div class="post-body">
    {{content}}
  </div>
  <script>hljs.highlightAll();<\/script>
</body>
</html>`;

    // 外部ファイル参照モード用テンプレート（{{css}}は使わず、<link>で直接読み込む）
    // hrefはサンプルとして公開CSSを指定。実際使う時は自分のCSSファイルへのパス（相対/絶対どちらも可）に書き換えてOK
    // インライン入力モードと違い、highlight.jsは含めない（Preview用途をシンプルに保つため。必要なら手動で足し戻してOK）
    const defaultWrapperExternal = `<!DOCTYPE html>
<html>
<head>
    <title>HTML Preview</title>
    <link rel="stylesheet" href="https://sasasakaz.github.io/pages/page_common.css">
</head>
<body>
  <div class="post-body">
    {{content}}
  </div>
</body>
</html>`;

    const input = document.getElementById('markdown-input');
    const output = document.getElementById('html-output');
    const cssInput = document.getElementById('css-input');
    const wrapperInput = document.getElementById('wrapper-input');
    const turndownService = new TurndownService({ headingStyle: 'atx', bulletListMarker: '-' });

    // --- localStorageへの自動保存 ---
    const STORAGE_KEY_CONTENT = 'mdConverter_content';
    const STORAGE_KEY_MODE = 'mdConverter_mode';
    const STORAGE_KEY_DRAFT = 'mdConverter_draft';
    const STORAGE_KEY_CSS = 'mdConverter_css';
    const STORAGE_KEY_WRAPPER = 'mdConverter_wrapper';
    const STORAGE_KEY_CSS_PRESET = 'mdConverter_cssPreset';

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY_CONTENT, input.value);
        localStorage.setItem(STORAGE_KEY_MODE, currentMode);
      } catch (e) {
        // プライベートブラウジング等でlocalStorageが使えない場合は何もしない
        console.warn('localStorageへの保存に失敗しました', e);
      }
    }

    // CSS欄・wrapper欄（プリセット選択含む）の保存
    function saveCssSettings() {
      try {
        localStorage.setItem(STORAGE_KEY_CSS, cssInput.value);
        localStorage.setItem(STORAGE_KEY_WRAPPER, wrapperInput.value);
        localStorage.setItem(STORAGE_KEY_CSS_PRESET, currentCssPreset);
      } catch (e) {
        console.warn('CSS設定のlocalStorageへの保存に失敗しました', e);
      }
    }

    // 現在選択中のCSSプリセット（'inline' or 'external'）
    let currentCssPreset = 'inline';
    const presetInlineBtn = document.getElementById('preset-inline-btn');
    const presetExternalBtn = document.getElementById('preset-external-btn');
    const cssModeHint = document.getElementById('css-mode-hint');

    function applyCssPreset(preset, options = {}) {
      currentCssPreset = preset;
      // ボタンの見た目を切り替え
      presetInlineBtn.classList.toggle('active', preset === 'inline');
      presetExternalBtn.classList.toggle('active', preset === 'external');

      // ボタンクリックによる明示的な切り替え時のみ、wrapper側のテンプレを差し替える
      // （復元時は保存済みのwrapper内容をそのまま尊重したいので、ここではスキップできるようにしてある）
      if (!options.skipTemplateSwap) {
        wrapperInput.value = (preset === 'inline') ? defaultWrapper : defaultWrapperExternal;
      }
      updateCssModeHint();
      saveCssSettings();
    }

    // 外部ファイル参照モードの時、wrapper-input内の<link>タグから参照先を検出して表示する
    // （css-input欄が使われないことも併せて明示）
    function updateCssModeHint() {
      if (currentCssPreset !== 'external') {
        cssModeHint.classList.add('hidden');
        return;
      }
      cssModeHint.classList.remove('hidden');

      // cdnjs（highlight.js用）以外のstylesheetリンクを「参照中のファイル」とみなす
      const matches = [...wrapperInput.value.matchAll(/<link[^>]*href=["']([^"']+)["'][^>]*>/g)];
      const hrefs = matches.map(m => m[1]).filter(h => !h.includes('cdnjs.cloudflare.com'));
      const href = hrefs.length ? hrefs[hrefs.length - 1] : null;

      cssModeHint.textContent = href
        ? `🔗 参照中: ${href} （下のCSS欄の内容はPreviewに反映されません）`
        : '⚠️ wrapper内に外部CSSの<link>タグが見つかりません（下のCSS欄の内容もPreviewに反映されません）';
    }

    // 予備欄（避難用メモ）はメイン欄・モードとは独立して保存する
    const draftInput = document.getElementById('draft-input');
    function saveDraftState() {
      try {
        localStorage.setItem(STORAGE_KEY_DRAFT, draftInput.value);
      } catch (e) {
        console.warn('予備欄のlocalStorageへの保存に失敗しました', e);
      }
    }
    draftInput.addEventListener('input', saveDraftState);

    // CSS欄・wrapper欄を手動で編集した場合も保存する
    cssInput.addEventListener('input', saveCssSettings);
    wrapperInput.addEventListener('input', () => {
      updateCssModeHint();
      saveCssSettings();
    });

    // デフォルトは3スペース固定インデント（オプション化されていないため上書き）。
    // ハイフンリストは2スペース、番号付きリストは4スペース固定でインデントする。
    // （番号付きは1〜99番台までなら4スペースで連番崩れは起きない）
    turndownService.addRule('listItem', {
      filter: 'li',
      replacement: function (content, node, options) {
        let prefix = options.bulletListMarker + ' ';
        const parent = node.parentNode;
        let indent = '  '; // ハイフンリストのインデント（2スペース）
        if (parent.nodeName === 'OL') {
          const start = parent.getAttribute('start');
          const index = Array.prototype.indexOf.call(parent.children, node);
          prefix = (start ? Number(start) + index : index + 1) + '. ';
          indent = '    '; // 番号付きリストのインデント（4スペース）
        }

        content = content
          .replace(/^\n+/, '') // 先頭の改行を除去
          .replace(/\n+$/, '\n') // 末尾の改行はひとつだけ残す
          .replace(/\n/gm, '\n' + indent);

        return (
          prefix + content + (node.nextSibling && !/\n$/.test(content) ? '\n' : '')
        );
      }
    });

    // 初期化
    cssInput.value = defaultCSS;
    wrapperInput.value = defaultWrapper;

    // 変換方向（'md2html' or 'html2md'）
    let currentMode = 'md2html';

    // --- 上部バー：ボタン定義（ここを編集すれば並び・内容を変えられる） ---
    const PINNED = [ // [id, アイコン, 説明] 常時表示
      ['strong', '🅱️', '強調 <strong>'],
      ['mark', '🌻', 'ハイライト 黄 (inline-mark)'],
      ['marker', '🖍️', 'マーカー (inline-marker)'],
      ['gray', '◽️', 'グレー (inline-gray)'],
      ['pink', '🌸', 'ハイライト ピンク (inline-pink)']
    ];
    const MENU = [ // [グループ名, [[id, アイコン, 説明], ...]] 「挿入 ▾」の中身
      ['インデント', [['indent_add', '➡️', 'インデント+（space4）'], ['indent_remove', '⬅️', 'インデント-（space4）']]],
      ['挿入', [['link', '🔗', 'リンク'], ['quote', '❝', '引用'], ['table', '📊', '表（TSVは範囲選択して押下）']]],
      ['コード', [['inline_code', '🏷️', 'インラインコード'], ['code', '🧱', 'コードブロック'], ['pre_quote', '📋', 'コード出力結果の貼付用']]],
      ['ボックス・区切り', [['info', '✅', '情報ボックス'], ['warn', '⚠️', '注意ボックス'], ['alert', '🚫', '警告ボックス'], ['note', '🗒️', '注釈ボックス'], ['br_hr', '➖', '改行＆区切り線']]]
    ];

    function runBtn(id) {
      if (id === 'indent_add') changeIndent('add');
      else if (id === 'indent_remove') changeIndent('remove');
      else insertTag(id);
    }
    function makeBtn(id, icon, title, inMenu) {
      const b = document.createElement('button');
      b.type = 'button';
      b.title = title;
      b.className = inMenu ? 'dd-item' : 'btn-tag btn-html pin-btn';
      b.textContent = inMenu ? icon + ' ' + title : icon;
      // ボタンを押してもテキストエリアの選択範囲が外れないようにする
      b.addEventListener('mousedown', e => e.preventDefault());
      b.addEventListener('click', () => runBtn(id));
      return b;
    }
    const pinnedEl = document.getElementById('pinned-btns');
    PINNED.forEach(([id, icon, title]) => pinnedEl.appendChild(makeBtn(id, icon, title, false)));
    const insertPanel = document.getElementById('insert-panel');
    MENU.forEach(([group, items], i) => {
      // グループ名は出さず、グループの切れ目に薄い区切り線だけ入れる
      if (i > 0) {
        const s = document.createElement('div');
        s.className = 'dd-sep';
        insertPanel.appendChild(s);
      }
      items.forEach(([id, icon, title]) => insertPanel.appendChild(makeBtn(id, icon, title, true)));
    });

    // --- ドロップダウン（☰ / 挿入 ▾） ---
    function closeDropdowns() {
      document.querySelectorAll('.dd-panel.open').forEach(p => p.classList.remove('open'));
    }
    document.querySelectorAll('.dd > button').forEach(b => {
      b.addEventListener('mousedown', e => e.preventDefault());
      b.addEventListener('click', e => {
        e.stopPropagation();
        const p = b.nextElementSibling;
        const wasOpen = p.classList.contains('open');
        closeDropdowns();
        if (!wasOpen) p.classList.add('open');
      });
    });
    document.addEventListener('click', closeDropdowns);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeDropdowns(); toggleSettings(false); }
    });

    // --- 右側の設定パネル ---
    const settingsPanel = document.getElementById('settings-wrapper');
    const settingsBtn = document.getElementById('settings-btn');
    function toggleSettings(force) {
      const open = force === undefined ? !settingsPanel.classList.contains('open') : force;
      settingsPanel.classList.toggle('open', open);
      settingsBtn.setAttribute('aria-expanded', open);
    }
    settingsBtn.addEventListener('click', () => toggleSettings());
    function resetSettings() {
      if (!confirm('CSS欄とHTML欄を初期値に戻します。よろしいですか？')) return;
      cssInput.value = defaultCSS;
      applyCssPreset('inline'); // wrapperも初期化して保存まで行う
    }

    // 上部バーの高さをCSS変数に反映（入力欄の高さ・設定パネル・左ドロワーの位置に使う）
    // --l3-topbar-h は body.layout-3col に定義されているため、同じ body に設定して上書きする
    const topbar = document.getElementById('topbar');
    new ResizeObserver(() => {
      document.body.style.setProperty('--l3-topbar-h', topbar.offsetHeight + 'px');
    }).observe(topbar);

    // --- モード切り替え ---
    function applyModeUI(mode) {
      currentMode = mode;
      const isMd2Html = mode === 'md2html';
      document.getElementById('tag-controls').style.display = isMd2Html ? 'flex' : 'none';
      document.getElementById('settings-wrapper').style.display = isMd2Html ? 'flex' : 'none';
      document.getElementById('preview-btn').style.display = isMd2Html ? 'inline-block' : 'none';
      document.getElementById('settings-btn').style.display = isMd2Html ? 'inline-block' : 'none'; document.getElementById('page-title').textContent = isMd2Html
        ? 'MarkdownをHTMLに変換するにゃん'
        : 'HTMLをMarkdownに変換するにゃん';
      document.getElementById('mode-badge').textContent = isMd2Html ? 'MD→HTML' : 'HTML→MD';
      input.placeholder = isMd2Html ? 'Input Markdown...' : 'Input HTML...';
      document.querySelector('#copy-btn .btn-label').textContent = isMd2Html ? 'Copy HTML' : 'Copy Markdown';
      document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('current', b.dataset.mode === mode));
    }
    function setMode(mode) {
      applyModeUI(mode);
      // 入力欄はクリアして混乱を防ぐ
      input.value = '';
      saveState();
      updateOutput();
    }
    // 入力があるときだけ確認ダイアログを出す（空なら即切り替え）
    function requestModeChange(mode) {
      if (mode === currentMode) return;
      if (input.value.trim() === '' || confirm('入力欄の内容は消えます。切り替えますか？')) setMode(mode);
    }

    // リアルタイム更新
    input.addEventListener('input', updateOutput);
    function updateOutput() {
      if (currentMode === 'md2html') {
        // 右側にはHTMLソースを文字列として表示する
        output.textContent = marked.parse(input.value);
      } else {
        // 右側にはMarkdownソースを文字列として表示する
        output.textContent = turndownService.turndown(input.value);
      }
      // 入力内容が変わるたびにlocalStorageへ保存（タブを閉じても復元できるように）
      saveState();
    }

    // ボタン押下時のタグ挿入関数
    function insertTag(type) {
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const currentText = input.value;
      const selectedText = currentText.substring(start, end);

      let insertText = "";
      switch (type) {
        case 'table':
          if (selectedText.trim()) {
            // TSV（またはスペース区切り）をテーブルに変換するロジック
            const lines = selectedText.trim().split('\n');
            const rows = lines.map(line => line.split(/\t/)); // タブで分割

            if (rows.length > 0) {
              let tableMd = "";
              rows.forEach((cols, index) => {
                tableMd += '| ' + cols.join(' | ') + ' |\n';
                // 1行目の後にセパレーターを入れる
                if (index === 0) {
                  tableMd += '| ' + cols.map(() => '---').join(' | ') + ' |\n';
                }
              });
              insertText = tableMd;
            }
          } else {
            // 何も選択されていない時はデフォルトのテンプレート
            insertText = '| Header | Header | Header |\n| :--- | :--- | :--- |\n| Cell | Cell | Cell |\n| Cell | Cell | Cell |\n';
          }
          break;
        // --- 他のケース（strong, link等） ---
        case 'link': insertText = '[' + (selectedText || 'テキスト') + '](https://google.com)'; break;
        case 'quote': insertText = '\n> ' + (selectedText || '引用文') + '\n'; break;
        // case 'table': insertText = '| Header | Header | Header |\n| :--- | :--- | :--- |\n| Cell | Cell | Cell |\n| Cell | Cell | Cell |\n'; break;
        case 'inline_code': insertText = "<span class='inline-code'>" + (selectedText || 'code') + "</span>"; break;
        case 'code': insertText = '\n```\n' + (selectedText || '') + '\n```\n'; break;
        case 'pre_quote': insertText = '\n<blockquote><pre>\n' + (selectedText || 'ここにテキストをペースト') + '\n</pre></blockquote>\n'; break;
        case 'strong': insertText = '<strong>' + (selectedText || '強調') + '</strong>'; break;
        case 'mark': insertText = "<span class='inline-mark'>" + (selectedText || 'mark') + "</span>"; break;
        case 'marker': insertText = "<span class='inline-marker'>" + (selectedText || 'marker') + "</span>"; break;
        case 'gray': insertText = "<span class='inline-gray'>" + (selectedText || 'gray') + "</span>"; break;
        case 'pink': insertText = "<span class='inline-pink'>" + (selectedText || 'pink') + "</span>"; break;
        case 'info': insertText = '<div class="mdc-info-box">\n<strong>✅ 情報</strong>\n<ul>\n  <li>' + (selectedText || 'ないようを入力') + '</li>\n</ul>\n</div>\n'; break;
        case 'warn': insertText = '<div class="mdc-warn-box">\n<strong>⚠️ 注意</strong>\n<ul>\n  <li>' + (selectedText || 'ないようを入力') + '</li>\n</ul>\n</div>\n'; break;
        case 'alert': insertText = '<div class="mdc-alert-box">\n<strong>🚫 警告</strong>\n<ul>\n  <li>' + (selectedText || 'ないようを入力') + '</li>\n</ul>\n</div>\n'; break;
        case 'note': insertText = '<div class="mdc-note-box">\n<strong>🗒️ 注釈</strong>\n<ul>\n  <li>' + (selectedText || 'ないようを入力') + '</li>\n</ul>\n</div>\n'; break;
        case 'br_hr': insertText = '\n<br>\n<hr>\n<br>\n'; break;
      }

      // 選択範囲を新しい文字列で置き換える
      input.value = currentText.substring(0, start) + insertText + currentText.substring(end);
      // プレビュー更新
      updateOutput();
      // フォーカスを戻す
      input.focus();
      // 挿入した文字の直後にカーソルをセット
      const newCursorPos = start + insertText.length;
      input.setSelectionRange(newCursorPos, newCursorPos);
    }

    // コピー完了は、ボタン内の文字をチェック(✓)に一時的に入れ替えて知らせる
    let copyDoneTimer;
    function copyToClipboard() {
      const btn = document.getElementById('copy-btn');
      navigator.clipboard.writeText(output.textContent).then(() => {
        btn.classList.add('copied');
        // 連続で押しても、最後に押してから1.5秒表示する
        clearTimeout(copyDoneTimer);
        copyDoneTimer = setTimeout(() => btn.classList.remove('copied'), 1500);
      });
    }

    function openPreview() {
      const markdownHTML = marked.parse(input.value);
      const userCSS = cssInput.value;
      let fullHTML = wrapperInput.value;
      // プレースホルダーの置換
      fullHTML = fullHTML.replaceAll('{{css}}', userCSS);
      fullHTML = fullHTML.replaceAll('{{content}}', markdownHTML);
      const previewWin = window.open('', 'previewWin', 'width=800,height=600');
      previewWin.document.write(fullHTML);
      previewWin.document.close();
    }


    function changeIndent(action) {
      const input = document.getElementById('markdown-input');
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const value = input.value;

      // 1. カーソルがある位置の「行の始まり」と「行の終わり」を特定する
      const lineStart = value.lastIndexOf('\n', start - 1) + 1;
      let lineEnd = value.indexOf('\n', end);
      if (lineEnd === -1) lineEnd = value.length;

      // 2. ターゲットになる行（または複数行）を抜き出す
      const targetText = value.substring(lineStart, lineEnd);
      const lines = targetText.split('\n');

      // 3. 各行に対してインデントの追加・削除をおこなう
      const processedLines = lines.map(line => {
        if (action === 'add') {
          // 💡 ➡️ ボタン：行頭に半角スペースを4個足す
          return '    ' + line;
        } else if (action === 'remove') {
          // 💡 ⬅️ ボタン：行頭にスペースがあれば、最大4個までスマートに削る
          return line.replace(/^ {1,4}/, '');
        }
        return line;
      });

      const newText = processedLines.join('\n');

      // 4. テキストエリアの中身を書き換える
      input.value = value.substring(0, lineStart) + newText + value.substring(lineEnd);

      // プレビューをリアルタイム更新
      updateOutput();

      // 5. フォーカスとカーソル位置を調整
      input.focus();
      const diff = newText.length - targetText.length;
      // カーソル位置をいい感じに補正して戻す
      input.setSelectionRange(start + (action === 'add' ? 4 : (diff < 0 ? diff : 0)), end + diff);
    }

    // --- 前回の内容を復元 ---
    // ブラウザのタブをうっかり閉じてしまっても、次に開いた時に続きから編集できるようにする
    function loadStateFromStorage() {
      try {
        const savedMode = localStorage.getItem(STORAGE_KEY_MODE);
        const savedContent = localStorage.getItem(STORAGE_KEY_CONTENT);

        // 保存されていたモードに合わせてUIだけ切り替える（クリアはしない。他タブでの変更にも追従）
        if (savedMode === 'html2md' || savedMode === 'md2html') applyModeUI(savedMode);

        if (savedContent !== null) {
          input.value = savedContent;
        }

        const savedDraft = localStorage.getItem(STORAGE_KEY_DRAFT);
        if (savedDraft !== null) {
          draftInput.value = savedDraft;
        }

        // CSS欄・wrapper欄・プリセット選択の復元
        const savedPreset = localStorage.getItem(STORAGE_KEY_CSS_PRESET);
        const savedCss = localStorage.getItem(STORAGE_KEY_CSS);
        const savedWrapper = localStorage.getItem(STORAGE_KEY_WRAPPER);

        if (savedCss !== null) {
          cssInput.value = savedCss;
        }
        if (savedWrapper !== null) {
          wrapperInput.value = savedWrapper;
        }
        // ボタンの見た目・ヒント表示だけ復元し、wrapperの中身は保存されていたものをそのまま尊重する
        // （skipTemplateSwap: trueで、テンプレの強制上書きを防ぐ）
        applyCssPreset(savedPreset === 'external' ? 'external' : 'inline', { skipTemplateSwap: true });

        updateOutput();
      } catch (e) {
        // localStorageが使えない環境（プライベートブラウジング等）では何もしない
        console.warn('localStorageからの復元に失敗しました', e);
      }
    }
    loadStateFromStorage();

    // --- 他タブでの更新を検知する ---
    // localStorageは同一オリジンで共有されるため、同じファイルを複数タブで開いて
    // それぞれ編集すると、後から保存した方で上書きされてしまう。
    // storageイベントは「自分以外のタブ」でlocalStorageが変更された時だけ発火するので、
    // それを使って「他のタブで更新されたよ」と気づけるようにする（自動上書きはしない）。
    const syncBanner = document.getElementById('sync-banner');
    const watchedStorageKeys = [
      STORAGE_KEY_CONTENT, STORAGE_KEY_MODE, STORAGE_KEY_DRAFT,
      STORAGE_KEY_CSS, STORAGE_KEY_WRAPPER, STORAGE_KEY_CSS_PRESET
    ];

    window.addEventListener('storage', (e) => {
      if (watchedStorageKeys.includes(e.key)) {
        syncBanner.classList.remove('hidden');
      }
    });

    function reloadFromOtherTab() {
      loadStateFromStorage();
      syncBanner.classList.add('hidden');
    }

    function dismissSyncBanner() {
      // 今の編集内容を優先して続ける（バナーを閉じるだけで、保存自体はこれまで通り継続する）
      syncBanner.classList.add('hidden');
    }
  </script>
</body>
