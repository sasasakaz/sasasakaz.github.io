<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL to QR code</title>
  <link rel="canonical" href="https://sasasakaz.github.io/pages/url_to_qr_code.html">
  <link rel="icon" href="https://sasasakaz.github.io/images/sasasakaz.png">
  <meta name="description" content="URLをQRコードに変換するツールにゃん。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="URL to QR code">
  <meta property="og:description" content="URLをQRコードに変換するツールにゃん。">
  <meta property="og:url" content="https://sasasakaz.github.io/pages/url_to_qr_code.html">
  <meta property="og:site_name" content="sasasakaz">
  <meta property="og:locale" content="ja_JP">
  <link rel="stylesheet" href="page_common.css">
  <script src="page_layout.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    h1 {
      /* margin-top: 0; */
      margin-bottom: revert;
      font-size: 1.5em;
    }

    #content {
      text-align: center;
    }

    .container {
      background: white;
      padding: 1.25rem;
      border-radius: 0.75rem;
      display: inline-block;
      box-shadow: 0 0.25rem 0.25rem rgba(0, 0, 0, 0.1);
    }

    #qrcode {
      margin: 1.25rem 0;
      display: flex;
      justify-content: center;
    }

    #qrcode img {
      border: 1px solid #eee;
      padding: 0.5rem;
    }

    input {
      padding: 0.75rem;
      width: 280px;
      font-size: 1rem;
      border: 1px solid #ddd;
      border-radius: 0.5rem;
    }

    .btn {
      display: block;
      margin: 1.25rem auto 0;
      padding: 0.5rem 1.25rem;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 0.5rem;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .btn:hover {
      background: #0056b3;
    }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QRGD44CZBH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-QRGD44CZBH');
  </script>
  <!-- End Google tag (gtag.js) -->
</head>

<body class="layout-3col l3-2col">

  <!-- 上部バー: 左ボタン（ページ一覧を開く） -->
  <header class="topbar">
    <button type="button" id="btn-left" class="topbar-btn" aria-controls="site-nav" aria-expanded="false"></button>
    <div id="topbar-title" class="topbar-title"></div>
  </header>
  <div id="side-backdrop" class="side-backdrop"></div>

  <div class="layout">
    <nav id="site-nav" class="side side-left" aria-label="ページ一覧"></nav>

    <main id="content">

      <div class="container">
        <h1>QRコード作成にゃん</h1>
        <input type="text" id="url-input" placeholder="URLを貼り付けてにゃん" oninput="generateQR()">
        <p>スマホやカメラでURL共有しやすいにゃん</p>

        <div id="qrcode"></div>

        <a id="download-btn" class="btn" style="display: none;">PNG画像として保存する</a>
      </div>

      <footer id="footer">
        <div class="footer-links">
          <a href="https://sasasakaz.github.io/">🏠 Home</a>
        </div>
        <p>Author: sasasakaz</p>
      </footer>
    </main>
  </div>

  <script>
    const qrcodeDiv = document.getElementById("qrcode");
    const downloadBtn = document.getElementById("download-btn");

    const qr = new QRCode(qrcodeDiv, {
      width: 256,
      height: 256,
      correctLevel: QRCode.CorrectLevel.H
    });

    function generateQR() {
      const url = document.getElementById("url-input").value;
      if (url) {
        qr.makeCode(url);

        // 少しだけ待ってから画像URLをボタンにセット（生成完了を待つ）
        setTimeout(() => {
          const img = qrcodeDiv.querySelector("img");
          if (img && img.src) {
            downloadBtn.href = img.src;
            downloadBtn.download = "qrcode.png"; // ここでファイル名を指定
            downloadBtn.style.display = "block";
          }
        }, 100);
      } else {
        downloadBtn.style.display = "none";
      }
    }
  </script>
</body>

</html>
