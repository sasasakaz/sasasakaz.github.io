<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diff Viewer</title>
    <link rel="canonical" href="https://sasasakaz.github.io/pages/diff-viewer.html">
    <link rel="icon" href="https://sasasakaz.github.io/images/sasasakaz.png">
    <meta name="description" content="左右比較ビューアにゃん">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Diff Viewer">
    <meta property="og:description" content="左右比較ビューアにゃん">
    <meta property="og:url" content="https://sasasakaz.github.io/pages/diff-viewer.html">
    <meta property="og:site_name" content="sasasakaz">
    <meta property="og:locale" content="ja_JP">
    <link rel="stylesheet" href="page-common.css">
    <script src="page-layout.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/diff@5.1.0/dist/diff.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/js/diff2html.min.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/css/diff2html.min.css">

    <style>
        .layout-3col {
            --l3-content-max: min(96%, 2200px);
            /* --l3-content-max: none; */
            /* 画面幅いっぱいに使う */
        }

        .input-area {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        textarea {
            flex: 1;
            height: 180px;
            padding: 1.25rem;
            border: 1px solid var(--c-border);
            border-radius: 0.5rem;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .options {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
        }

        .btn-container {
            text-align: center;
            margin-bottom: 1.25rem;
        }

        button {
            padding: 0.5rem 2rem;
            cursor: pointer;
            background: var(--c-brand-vivid);
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            font-size: 1rem;
        }

        button:hover {
            background: var(--c-brand-vivid-hover);
        }

        .field {
            flex: 1;
            position: relative;
            display: flex;
        }

        .field textarea {
            width: 100%;
        }

        /* グレー系の小さめボタン（Clear / リセット）の共通部分 */
        button.clear-btn,
        button.reset-btn {
            font-weight: normal;
            background: var(--c-bg-subtle);
            color: var(--c-text-sub);
            border: 1px solid var(--c-border);
        }

        button.clear-btn:hover,
        button.reset-btn:hover {
            background: var(--c-border);
        }

        button.clear-btn {
            position: absolute;
            top: 0.4rem;
            right: 0.4rem;
            padding: 0.15rem 0.5rem;
            font-size: 0.75rem;
            border-radius: 0.375rem;
        }

        button.clear-btn[hidden] {
            display: none;
        }

        button.reset-btn {
            margin-left: 0.5rem;
        }

        #output {
            background: var(--c-bg);
            border: 1px solid var(--c-border);
            border-radius: 0.5rem;
        }

        /* 長い行を表示幅で折り返す */
        #output .d2h-file-side-diff {
            overflow-x: hidden;
        }

        #output .d2h-diff-table {
            table-layout: auto;
            width: 100%;
        }

        /* 行番号セルは absolute なので、コード側のセルが残り幅を全て使うようにする */
        #output .d2h-diff-table td:not(.d2h-code-side-linenumber):not(.d2h-code-linenumber) {
            width: 100%;
        }

        /* 内部HTMLの改行・インデントが pre-wrap で表示されないよう flex 化 */
        #output .d2h-code-side-line,
        #output .d2h-code-line {
            display: flex;
            box-sizing: border-box;
            width: 100%;
            padding: 0 0.5em 0 4.5em;
        }

        #output .d2h-code-line-prefix {
            flex: none;
        }

        #output .d2h-code-line-ctn {
            display: block;
            flex: 1;
            min-width: 0;
            width: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        #output:empty {
            display: none;
        }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QRGD44CZBH"></script>

</head>

<body class="layout-3col l3-drawer">
    <div class="topbar">
        <button type="button" id="btn-left" class="topbar-btn" aria-controls="site-nav" aria-expanded="false"></button>
        <div id="topbar-title" class="topbar-title"></div>
    </div>
    <div id="side-backdrop" class="side-backdrop"></div>
    <div class="layout">
        <nav id="site-nav" class="side side-left" aria-label="ページ一覧"></nav>

        <main id="content">
            <header id="header">
                <h1>左右比較ビューアにゃん</h1>
            </header>
            <div class="input-area">
                <div class="field">
                    <textarea id="old" placeholder="Before（older）"></textarea>
                    <button type="button" class="clear-btn" data-target="old" hidden>Clear</button>
                </div>
                <div class="field">
                    <textarea id="new" placeholder="After（newer）"></textarea>
                    <button type="button" class="clear-btn" data-target="new" hidden>Clear</button>
                </div>
            </div>
            <div class="options">
                <label><input type="checkbox" id="opt-trim-start"> 行頭の空白を無視</label>
                <label><input type="checkbox" id="opt-trim-end"> 行末の空白を無視</label>
                <label><input type="checkbox" id="opt-eol" checked> 改行コードの違いを無視</label>
            </div>
            <div class="btn-container">
                <button onclick="compare()">比較実行にゃん！</button>
                <button type="button" class="reset-btn" onclick="resetAll()">リセットにゃん</button>
            </div>

            <div id="output"></div>

            <footer id="footer">
                <div class="footer-links">
                    <a href="https://sasasakaz.github.io/">🏠 Home</a>
                    <span class="separator">|</span>
                    <a href="#header">Back to Top</a>
                </div>
                <p>Author: sasasakaz</p>
            </footer>
        </main>
    </div>

    <script>
        function updateClearButtons() {
            document.querySelectorAll('.clear-btn').forEach(btn => {
                btn.hidden = document.getElementById(btn.dataset.target).value === '';
            });
        }

        document.querySelectorAll('.clear-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const ta = document.getElementById(btn.dataset.target);
                ta.value = '';
                updateClearButtons();
                ta.focus();
            });
        });
        document.querySelectorAll('.input-area textarea').forEach(ta => {
            ta.addEventListener('input', updateClearButtons);
        });

        function resetAll() {
            if (!confirm('入力内容と比較結果をすべてリセットしますか？')) return;
            document.getElementById('old').value = '';
            document.getElementById('new').value = '';
            document.getElementById('output').innerHTML = '';
            updateClearButtons();
        }

        updateClearButtons();

        function compare() {
            const normalize = text => {
                if (document.getElementById('opt-eol').checked) text = text.replace(/\r\n?/g, '\n');
                const ts = document.getElementById('opt-trim-start').checked;
                const te = document.getElementById('opt-trim-end').checked;
                if (!ts && !te) return text;
                return text.split('\n').map(l => ts && te ? l.trim() : ts ? l.trimStart() : l.trimEnd()).join('\n');
            };
            const oldVal = normalize(document.getElementById('old').value);
            const newVal = normalize(document.getElementById('new').value);
            const out = document.getElementById('output');

            try {
                // 1. 差分データを生成 (jsdiffの関数名に注意)
                // ライブラリによっては Diff.createTwoFilesPatch だったり 
                // グローバルな JsDiff を使う場合があるので、安定した呼び出し方にしています
                const patch = Diff.createTwoFilesPatch("Before", "After", oldVal, newVal);

                // 2. Diff2HtmlでHTMLを生成
                const html = Diff2Html.html(patch, {
                    inputFormat: 'diff',
                    showFiles: false,
                    matching: 'lines',
                    outputFormat: 'side-by-side' // 左右表示
                });

                // 3. 画面に表示
                out.innerHTML = html;
            } catch (e) {
                console.error(e);
                alert("実行中にエラーが発生したよ。コンソールを確認してみてにゃん！");
            }
        }
    </script>
</body>

</html>
